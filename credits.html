<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HenjVR — Credits</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- ======================================================
       Mouse Tracker
       ====================================================== -->

  <div
    class="mouse-tracker"
    aria-hidden="true"
  >
    <div
      class="mt-glow"
      id="mtGlow"
    ></div>

    <div
      class="mt-dot1"
      id="mtDot1"
    ></div>

    <div
      class="mt-dot2"
      id="mtDot2"
    ></div>
  </div>


  <!-- ======================================================
       Click Pop Effects
       ====================================================== -->

  <div
    class="click-pop-layer"
    id="clickPopLayer"
    aria-hidden="true"
  ></div>


  <!-- ======================================================
       Credits Page
       ====================================================== -->

  <main class="credits-page">

    <section class="credits-section">

      <!-- Scanlines -->
      <div
        class="scanlines"
        aria-hidden="true"
        style="
          position:absolute;
          inset:0;
          opacity:0.3;
          pointer-events:none;
        "
      ></div>


      <!-- Floating Pixel Accents -->

      <div
        class="accent-pixel pixel-border-pink"
        aria-hidden="true"
        style="
          left:6%;
          top:16%;
          width:16px;
          height:16px;
          background:#FF3DF0;
        "
      ></div>

      <div
        class="accent-pixel pixel-border"
        aria-hidden="true"
        style="
          right:8%;
          top:22%;
          width:12px;
          height:12px;
          background:#7F00FF;
          animation-delay:0.8s;
        "
      ></div>

      <div
        class="accent-pixel pixel-border"
        aria-hidden="true"
        style="
          left:10%;
          bottom:14%;
          width:12px;
          height:12px;
          background:#ffffff;
          animation-delay:1.4s;
        "
      ></div>

      <div
        class="accent-pixel pixel-border-pink"
        aria-hidden="true"
        style="
          right:12%;
          bottom:18%;
          width:16px;
          height:16px;
          background:#FF3DF0;
          animation-delay:0.4s;
        "
      ></div>


      <!-- ==================================================
           Header
           ================================================== -->

      <div class="credits-header reveal">

        <div class="credits-label">
          - Credits -
        </div>

        <h1 class="credits-title">
          The Owners
        </h1>

        <p class="credits-sub">
          The monkeys behind HenjVR.
          Built by fans, for fans.
        </p>

      </div>


      <!-- ==================================================
           Owner Cards
           ================================================== -->

      <div class="credits-grid">


        <!-- =================================================
             STUNT
             ================================================= -->

        <article
          class="owner-card reveal"
          style="transition-delay:0ms;"
        >

          <div class="owner-img-wrap">

            <img
              src="https://yt3.googleusercontent.com/gT19VNPd6INqTeEHsYHdl0JdHbUhoHlaJS8BwoyGRdLyOCbds5vd4ShDigYBL5XV4ihoLG0WjQY=s160-c-k-c0x00ffffff-no-rj"
              alt="Stunt"
              class="pixelated"
            >

          </div>

          <h3 class="owner-name">
            Stunt
          </h3>

          <p class="owner-role">
            Main Developer
          </p>

          <a
            class="yt-btn"
            href="https://www.youtube.com/channel/UCo7XiSXx7lBhLkw9NtHLdRQ"
            target="_blank"
            rel="noopener noreferrer"
          >

            <span
              class="wave"
              aria-hidden="true"
            ></span>

            <span aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
              </svg>
            </span>

            <span>
              YouTube
            </span>

          </a>

        </article>


        <!-- =================================================
             CYANKING
             ================================================= -->

        <article
          class="owner-card reveal"
          style="transition-delay:150ms;"
        >

          <!-- Birthday Badge -->
          <div class="bday-badge">
            <span>
              Happy B-Day
            </span>
          </div>

          <div class="owner-img-wrap">

            <img
              src="https://yt3.googleusercontent.com/qkCuXVi7lBWQbGenxHWPrM4dLm4n8Y74WsH56HkLCCRviP-oMelJ-QPgWFAq6WPUKCpwkaYadw=s160-c-k-c0x00ffffff-no-rj"
              alt="Cyanking"
              class="pixelated"
            >

          </div>

          <h3 class="owner-name">
            Cyanking
          </h3>

          <p class="owner-role">
            Main Modeler
          </p>

          <a
            class="yt-btn"
            href="https://www.youtube.com/@CyanKingVR"
            target="_blank"
            rel="noopener noreferrer"
          >

            <span
              class="wave"
              aria-hidden="true"
            ></span>

            <span aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
              </svg>
            </span>

            <span>
              YouTube
            </span>

          </a>

        </article>


        <!-- =================================================
             CHEESE
             ================================================= -->

        <article
          class="owner-card reveal"
          style="transition-delay:300ms;"
        >

          <div class="owner-img-wrap">

            <img
              src="https://cdn.discordapp.com/attachments/1538658994741317785/1540124682479734935/image.png?ex=6a88d062&is=6a877ee2&hm=e4f4be5953028d440a8e520f6213e2b874b72451a14bcf4076d8bef6928f1de7&"
              alt="Cheese"
              class="pixelated"
            >

          </div>

          <h3 class="owner-name">
            Cheese
          </h3>

          <p class="owner-role">
            Manager
          </p>

          <a
            class="yt-btn"
            href="https://www.youtube.com/@TGGcheese"
            target="_blank"
            rel="noopener noreferrer"
          >

            <span
              class="wave"
              aria-hidden="true"
            ></span>

            <span aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
              </svg>
            </span>

            <span>
              YouTube
            </span>

          </a>

        </article>


      </div>


      <!-- ==================================================
           Back Home
           ================================================== -->

      <div
        class="back-home-wrap reveal"
        style="transition-delay:450ms;"
      >

        <a
          href="index.html"
          class="back-home"
        >
          ← Back Home
        </a>

      </div>

    </section>

  </main>


  <!-- ======================================================
       Credits JavaScript
       ====================================================== -->

  <script
    type="module"
    src="./src/credits.js"
  ></script>

</body>
</html>
