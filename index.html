<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HenjVR</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- ======================================================
       Mouse Tracker
       ====================================================== -->

  <div
    class="mouse-tracker"
    aria-hidden="true"
  >
    <div
      class="mt-glow"
      id="mtGlow"
    ></div>

    <div
      class="mt-dot1"
      id="mtDot1"
    ></div>

    <div
      class="mt-dot2"
      id="mtDot2"
    ></div>
  </div>


  <!-- ======================================================
       Click Pop Effects
       ====================================================== -->

  <div
    class="click-pop-layer"
    id="clickPopLayer"
    aria-hidden="true"
  ></div>


  <!-- ======================================================
       Main Application
       ====================================================== -->

  <div id="root"></div>


  <!-- ======================================================
       Main JavaScript
       ====================================================== -->

  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
