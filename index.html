<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HenjVR</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="deco-layer" style="position:relative;"></div>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero">
      <div class="eyebrow-tag">
        <span class="dot"></span>
        <span id="hero-eyebrow"></span>
      </div>

      <div class="hero-portrait">
        <img id="hero-portrait" alt="HenjVR character" />
      </div>

      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-desc" id="hero-desc"></p>

      <a class="btn btn-outline" id="coming-soon-btn"></a>
      <div class="scroll-hint" id="scroll-hint"></div>
    </section>

    <section class="releasing">
      <h2 id="releasing-title"></h2>
      <div class="range" id="releasing-range"></div>
      <p class="note" id="releasing-note"></p>
    </section>

    <section class="community-banner">
      <p id="community-quote"></p>
      <div class="attribution" id="community-attribution"></div>
    </section>

    <section class="section">
      <h2 id="sneak-eyebrow"></h2>
      <p class="lede" id="sneak-title"></p>
      <div class="card-grid" id="sneak-grid"></div>
    </section>

    <section class="almost-there">
      <div class="eyebrow-tag">
        <span class="dot"></span>
        <span id="almost-eyebrow"></span>
      </div>
      <h2 id="almost-title"></h2>
      <p class="subtitle" id="almost-subtitle"></p>
      <div class="chevrons">▾ ▾ ▾</div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
